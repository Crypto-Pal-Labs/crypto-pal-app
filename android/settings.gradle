pluginManagement {
  repositories {
    gradlePluginPortal()
    google()
    mavenCentral()
  }
  // RN Gradle plugin lives in node_modules; include its build
  includeBuild("../node_modules/@react-native/gradle-plugin")
}

plugins {
  id("com.facebook.react.settings")
  id("com.android.application") version "8.6.1" apply false
  id("com.android.library")    version "8.6.1" apply false
  id("org.jetbrains.kotlin.android") version "2.0.21" apply false
}

// --- Expo autolinking (SDK 53)
apply from: new File(
  ["node","--print","require.resolve('@expo/config-plugins/package.json')"]
    .execute(null, rootDir)
    .text
    .trim(),
  "../android/expoAutolinking.gradle"
)
useExpoModules()

rootProject.name = "Crypto Pal"
include(":app")